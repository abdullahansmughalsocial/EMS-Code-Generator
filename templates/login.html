<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PLC & CODESYS Generator — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Saira:wght@300;400;500;600;700&family=Orbitron:wght@400;600;700;900&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }

    .login-wrap {
      position: relative; z-index: 10;
      width: 100%; max-width: 420px;
      padding: 20px;
    }

    .login-logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .login-logo-icon {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, var(--accent), var(--amber));
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      color: #000;
      margin-bottom: 14px;
      box-shadow: 0 0 30px var(--accent-gl);
    }
    .login-logo-name {
      font-family: var(--font-hd);
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: .2em;
      color: var(--txt1);
      display: block;
    }
    .login-logo-sub {
      font-size: .72rem;
      color: var(--txt3);
      font-family: var(--font-co);
      letter-spacing: .06em;
      display: block;
      margin-top: 4px;
    }

    .login-card {
      background: var(--bg2);
      border: 1px solid var(--border2);
      border-radius: var(--radius-xl);
      padding: 32px;
      box-shadow: var(--shadow-lg), 0 0 60px rgba(0,212,255,.05);
      backdrop-filter: blur(20px);
    }

    .login-title {
      font-family: var(--font-hd);
      font-size: .78rem;
      font-weight: 600;
      letter-spacing: .12em;
      color: var(--txt2);
      text-transform: uppercase;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .login-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .login-field {
      margin-bottom: 16px;
    }
    .login-field label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: .7rem;
      font-weight: 600;
      color: var(--txt2);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 6px;
    }
    .login-field label i { color: var(--accent); font-size: .75rem; }

    .login-input-wrap {
      position: relative;
    }
    .login-input-wrap input {
      width: 100%;
      padding: 11px 44px 11px 14px;
      background: var(--bg1);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      color: var(--txt1);
      font-family: var(--font-ui);
      font-size: .88rem;
      transition: all var(--trans);
      outline: none;
    }
    .login-input-wrap input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-lo);
    }
    .login-input-wrap .input-icon {
      position: absolute;
      right: 13px; top: 50%;
      transform: translateY(-50%);
      color: var(--txt3);
      font-size: .85rem;
      pointer-events: none;
      transition: color var(--trans);
    }
    .login-input-wrap input:focus ~ .input-icon { color: var(--accent); }

    .pw-toggle {
      pointer-events: all !important;
      cursor: pointer;
    }

    .login-error {
      background: var(--red-lo);
      border: 1px solid rgba(255,61,90,.3);
      border-left: 3px solid var(--red);
      border-radius: var(--radius);
      padding: 10px 14px;
      font-size: .78rem;
      color: var(--red2);
      margin-bottom: 16px;
      display: none;
      align-items: center;
      gap: 8px;
    }
    .login-error.show { display: flex; animation: fade-in .2s ease; }

    .login-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none;
      border-radius: var(--radius);
      color: #000;
      font-family: var(--font-ui);
      font-size: .88rem;
      font-weight: 700;
      letter-spacing: .04em;
      cursor: pointer;
      transition: all var(--trans);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 0 16px var(--accent-gl);
      margin-top: 8px;
    }
    .login-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 0 28px var(--accent-gl);
      filter: brightness(1.08);
    }
    .login-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
      transform: none;
    }

    .login-footer {
      text-align: center;
      margin-top: 20px;
      font-size: .7rem;
      color: var(--txt3);
      font-family: var(--font-co);
    }

    .theme-toggle-login {
      position: fixed;
      top: 16px; right: 16px;
      width: 36px; height: 36px;
      background: var(--bg2);
      border: 1px solid var(--border2);
      border-radius: 8px;
      color: var(--txt2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .9rem;
      z-index: 100;
      transition: all var(--trans);
    }
    .theme-toggle-login:hover {
      color: var(--amber);
      border-color: var(--amber);
    }

    /* light overrides */
    [data-theme="light"] .login-card {
      box-shadow: var(--shadow-lg);
    }
  </style>
</head>
<body>

<div class="bg-scene">
  <div class="bg-img"></div>
  <div class="bg-overlay"></div>
  <div class="bg-grid"></div>
  <div class="bg-scanlines"></div>
</div>

<button class="theme-toggle-login" id="theme-toggle" title="Toggle theme">
  <i class="fa-solid fa-moon" id="theme-icon-side"></i>
</button>

<div class="login-wrap">
  <div class="login-logo">
    <div class="login-logo-icon">
      <i class="fa-solid fa-bolt-lightning"></i>
    </div>
    <span class="login-logo-name">PLCGEN</span>
    <span class="login-logo-sub">PLC &amp; CODESYS Generator — Secure Access</span>
  </div>

  <div class="login-card">
    <div class="login-title">
      <i class="fa-solid fa-shield-halved" style="color:var(--accent)"></i>
      Sign In
    </div>

    <div class="login-error" id="login-error">
      <i class="fa-solid fa-circle-xmark"></i>
      <span id="login-error-msg">Invalid credentials</span>
    </div>

    <div class="login-field">
      <label><i class="fa-solid fa-user"></i> Username</label>
      <div class="login-input-wrap">
        <input type="text" id="username" placeholder="Enter username" autocomplete="username" />
        <i class="fa-solid fa-user input-icon"></i>
      </div>
    </div>

    <div class="login-field">
      <label><i class="fa-solid fa-lock"></i> Password</label>
      <div class="login-input-wrap">
        <input type="password" id="password" placeholder="Enter password" autocomplete="current-password" />
        <i class="fa-solid fa-eye pw-toggle input-icon" id="pw-toggle" title="Show/hide password"></i>
      </div>
    </div>

    <button class="login-btn" id="login-btn">
      <i class="fa-solid fa-right-to-bracket"></i>
      <span id="login-btn-text">Sign In</span>
    </button>

    <div class="login-footer">
      Secure industrial control system access
    </div>
  </div>
</div>

<script src="/static/js/theme.js"></script>
<script>
'use strict';

const usernameEl = document.getElementById('username');
const passwordEl = document.getElementById('password');
const loginBtn   = document.getElementById('login-btn');
const errorBox   = document.getElementById('login-error');
const errorMsg   = document.getElementById('login-error-msg');
const pwToggle   = document.getElementById('pw-toggle');

// Password toggle
pwToggle.addEventListener('click', () => {
  const isText = passwordEl.type === 'text';
  passwordEl.type = isText ? 'password' : 'text';
  pwToggle.className = `fa-solid fa-${isText ? 'eye' : 'eye-slash'} pw-toggle input-icon`;
});

// Enter key submits
[usernameEl, passwordEl].forEach(el =>
  el.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); })
);

loginBtn.addEventListener('click', doLogin);

function showError(msg) {
  errorMsg.textContent = msg;
  errorBox.classList.add('show');
}
function hideError() {
  errorBox.classList.remove('show');
}

async function doLogin() {
  const username = usernameEl.value.trim();
  const password = passwordEl.value;
  if (!username || !password) {
    showError('Please enter both username and password.');
    return;
  }
  hideError();
  loginBtn.disabled = true;
  document.getElementById('login-btn-text').textContent = 'Signing in...';
  loginBtn.querySelector('i').className = 'fa-solid fa-spinner fa-spin';

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (data.status === 'success') {
      loginBtn.querySelector('i').className = 'fa-solid fa-check';
      document.getElementById('login-btn-text').textContent = 'Access Granted';
      loginBtn.style.background = 'linear-gradient(135deg, var(--green), var(--green2))';
      setTimeout(() => { window.location.href = '/'; }, 500);
    } else {
      showError(data.message || 'Invalid credentials.');
      loginBtn.disabled = false;
      document.getElementById('login-btn-text').textContent = 'Sign In';
      loginBtn.querySelector('i').className = 'fa-solid fa-right-to-bracket';
      passwordEl.value = '';
      passwordEl.focus();
    }
  } catch (e) {
    showError('Connection error. Please try again.');
    loginBtn.disabled = false;
    document.getElementById('login-btn-text').textContent = 'Sign In';
    loginBtn.querySelector('i').className = 'fa-solid fa-right-to-bracket';
  }
}

// Focus username on load
window.addEventListener('load', () => usernameEl.focus());
</script>
</body>
</html>
